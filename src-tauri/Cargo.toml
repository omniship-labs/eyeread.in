[package]
name = "eyeread-in"
version = "0.0.0"
description = "eyeread.in — invisible teleprompter"
authors = ["OmniShip"]
license = "AGPL-3.0"
edition = "2021"
default-run = "eyeread-in"

[features]
# OmniShip's sign-pack tool (src/bin/sign-pack.rs). Never enabled for app builds.
pack-signing = ["dep:minisign"]

[[bin]]
name = "sign-pack"
path = "src/bin/sign-pack.rs"
required-features = ["pack-signing"]

[lib]
name = "eyeread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api is required for the transparent overlay window on macOS
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Connected apps API: token generation + hashing (both already in the tree via tauri)
getrandom = "0.2"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
semver = "1.0.28"
regex = "1.13.1"
jsonschema = { version = "0.57.0", default-features = false }
minisign-verify = "0.2"
minisign = { version = "0.9", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2"
tokio = { version = "1", features = ["time", "net", "rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSPanel", "NSColor", "NSGraphics"] }
objc2-foundation = "0.3"

[dev-dependencies]
minisign = "0.9"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

